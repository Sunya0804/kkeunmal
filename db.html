<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>끝말잇기 단어 검색과 전체 단어 목록 - 컴퓨터와 하는 끝말잇기</title>
  <meta name="description" content="끝말잇기에 쓸 수 있는 표준국어대사전 명사 21만 개를 가나다순으로 볼 수 있습니다. 단어를 검색하면 그 뒤에 이을 수 있는 단어가 이기기에 유리한 순서로 나옵니다.">
  <link rel="canonical" href="https://sunya0804.github.io/kkeunmal/db.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="컴퓨터와 하는 끝말잇기">
  <meta property="og:title" content="끝말잇기 단어 검색과 전체 단어 목록">
  <meta property="og:description" content="끝말잇기에 쓸 수 있는 표준국어대사전 명사 21만 개를 가나다순으로 볼 수 있습니다. 단어를 검색하면 그 뒤에 이을 수 있는 단어가 이기기에 유리한 순서로 나옵니다.">
  <meta property="og:url" content="https://sunya0804.github.io/kkeunmal/db.html">
  <meta property="og:image" content="https://sunya0804.github.io/kkeunmal/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app wide">
    <header>
      <h1>전체 DB</h1>
      <p class="sub">표준국어대사전 명사 <span id="wordCount">-</span>개</p>
      <nav class="nav">
        <a href="index.html">게임</a>
        <a href="guide.html">게임 방법</a>
        <a href="hanbang.html">한방단어</a>
        <a href="db.html" aria-current="page">전체 DB</a>
      </nav>
    </header>

    <section>
      <form id="searchForm" autocomplete="off">
        <input id="search" type="text" maxlength="20" placeholder="단어를 입력하고 엔터 (예: 가족)">
        <button type="submit" class="primary">이어지는 단어 찾기</button>
      </form>
      <div class="message" id="searchMessage"></div>
    </section>

    <section class="cheat" id="resultPanel" hidden>
      <h2><span id="resultTitle"></span> <span class="legend">W+2: 2턴 안에 이김 · L-3: 3턴 안에 짐 · W+0: 한방단어</span></h2>
      <p class="definition" id="resultDef"></p>
      <p class="legend">이기기에 유리한 순서입니다. 쌍방이 최선의 단어만 낸다고 할 때의 결과이며, 단어를 누르면 그 단어에 이어지는 단어를 다시 찾습니다.</p>
      <div id="resultList"></div>
    </section>

    <section>
      <div class="db-bar">
        <h2>모든 단어</h2>
        <label>정렬
          <select id="order">
            <option value="asc" selected>가나다 오름차순 (ㄱ → ㅎ)</option>
            <option value="desc">가나다 내림차순 (ㅎ → ㄱ)</option>
          </select>
        </label>
        <span class="pager">
          <button id="prev" type="button">이전</button>
          <input id="page" type="number" min="1" step="1" value="1"> / <span id="pageCount">1</span> 쪽
          <button id="next" type="button">다음</button>
        </span>
      </div>
      <div class="db-words" id="words"></div>
    </section>
  </main>

  <script src="data/words.js"></script>
  <script src="definitions.js"></script>
  <script src="engine.js"></script>
  <script src="cheatview.js"></script>
  <script src="db.js"></script>
</body>
</html>
